# Run with `go tool task <name>`.
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  PLUGINS: _ref/Win64/Debug/Plugins64
  BUNDLE: internal/tools/bundle
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    cmds:
      - task: build

  bundle:
    desc: Update the committed tool bundle in {{.BUNDLE}} after changing tools (PLUGINS=<dir> to override the source)
    # No sources/generates: pack only recompresses files that changed.
    cmds:
      - go run ./internal/tools/pack -src {{.PLUGINS}} -out {{.BUNDLE}}

  build:
    desc: Build bin/fox with all tools
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/fox{{exeExt}} .

  build-lite:
    desc: Build bin/fox-lite without ImageMagick and Ghostscript (taken from the host if installed)
    cmds:
      - go build -tags lite -trimpath -ldflags "{{.LDFLAGS}}" -o bin/fox-lite{{exeExt}} .

  release:
    desc: Build bin/fox and bin/fox-lite
    cmds:
      - task: build
      - task: build-lite

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  run:
    desc: Run fox from source (pass arguments after --)
    cmds:
      - go run . {{.CLI_ARGS}}

  clean:
    desc: Remove build output and extracted tools
    cmds:
      - rm -rf bin fox-tools
